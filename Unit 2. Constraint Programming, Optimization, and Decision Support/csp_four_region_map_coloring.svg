<svg width="100%" viewBox="0 0 690 450" role="img" xmlns="http://www.w3.org/2000/svg" style="" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Map coloring constraint satisfaction problem</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Four regions A, B, C, D. A borders B and C; B borders A, C, D; C borders A, B, D; D borders B and C. A and D do not touch and share red; B is blue and C is green.</desc><rect x="0" y="0" width="680" height="440" fill="#FFFFFF" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><g stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" style="fill:rgb(0, 0, 0);stroke:rgb(255, 255, 255);color:rgb(11, 11, 11);stroke-width:5px;stroke-linecap:butt;stroke-linejoin:round;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><polygon points="70,220 200,60 260,220 200,380" fill="#C62828" style="fill:rgb(198, 40, 40);stroke:rgb(255, 255, 255);color:rgb(11, 11, 11);stroke-width:5px;stroke-linecap:butt;stroke-linejoin:round;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><polygon points="200,60 480,60 400,220 260,220" fill="#1565C0" style="fill:rgb(21, 101, 192);stroke:rgb(255, 255, 255);color:rgb(11, 11, 11);stroke-width:5px;stroke-linecap:butt;stroke-linejoin:round;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><polygon points="260,220 400,220 480,380 200,380" fill="#2E7D32" style="fill:rgb(46, 125, 50);stroke:rgb(255, 255, 255);color:rgb(11, 11, 11);stroke-width:5px;stroke-linecap:butt;stroke-linejoin:round;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><polygon points="400,220 480,60 610,220 480,380" fill="#C62828" style="fill:rgb(198, 40, 40);stroke:rgb(255, 255, 255);color:rgb(11, 11, 11);stroke-width:5px;stroke-linecap:butt;stroke-linejoin:round;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/></g><g fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" text-anchor="middle" dominant-baseline="central" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, Helvetica, sans-serif;font-size:48px;font-weight:700;text-anchor:middle;dominant-baseline:central"><text x="165" y="220" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, Helvetica, sans-serif;font-size:48px;font-weight:700;text-anchor:middle;dominant-baseline:auto">A</text><text x="340" y="140" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, Helvetica, sans-serif;font-size:48px;font-weight:700;text-anchor:middle;dominant-baseline:auto">B</text><text x="340" y="300" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, Helvetica, sans-serif;font-size:48px;font-weight:700;text-anchor:middle;dominant-baseline:auto">C</text><text x="515" y="220" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, Helvetica, sans-serif;font-size:48px;font-weight:700;text-anchor:middle;dominant-baseline:auto">D</text></g></svg>